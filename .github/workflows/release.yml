name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          VERSION=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('quotaring/__init__.py').read())[1])")
          [ "v$VERSION" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != quotaring.__version__ $VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  linux:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Tests run inside the container before PyInstaller (Ubuntu 22.04, glibc 2.35).
      - run: ./packaging/linux/build_in_docker.sh
      - run: ./packaging/linux/build_appimage_docker.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            packaging/out/*.tar.gz
            packaging/out/*.deb
            packaging/out/*.AppImage

  windows:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: choco install innosetup -y --no-progress
      - run: powershell -ExecutionPolicy Bypass -File packaging\windows\build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            packaging/out/*.zip
            packaging/out/*-setup.exe

  release:
    needs: [check-version, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${{ needs.check-version.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "QuotaRing $GITHUB_REF_NAME" --notes-file notes.md
