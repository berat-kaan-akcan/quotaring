[build-system]
requires = ["setuptools>=77"]  # SPDX string in project.license
build-backend = "setuptools.build_meta"

[project]
name = "quotaring"
version = "0.1.0"
description = "Desktop widget showing Claude Code, OpenAI Codex and Google Antigravity usage"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Berat Kaan Akcan" }]
dependencies = [
    # 6.12 breaks on Python < 3.12 (None refcount bug, abort at exit); see requirements.txt
    "PySide6-Essentials>=6.6; python_version >= '3.12'",
    "PySide6-Essentials>=6.6,<6.12; python_version < '3.12'",
]

[project.urls]
Homepage = "https://github.com/berat-kaan-akcan/quotaring"
Issues = "https://github.com/berat-kaan-akcan/quotaring/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.10"]

[project.gui-scripts]
quotaring = "quotaring.app:main"

[tool.setuptools.packages.find]
include = ["quotaring*"]

[tool.setuptools.package-data]
"quotaring.ui" = ["qml/*.qml", "qml/*.js"]
