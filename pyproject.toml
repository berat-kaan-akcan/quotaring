[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-usage-widget"
version = "0.1.0"
description = "Desktop widget showing Claude Code, OpenAI Codex and Google Antigravity usage"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["PySide6-Essentials>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.10"]

[project.gui-scripts]
ai-usage-widget = "aiusage.app:main"

[tool.setuptools.packages.find]
include = ["aiusage*"]
