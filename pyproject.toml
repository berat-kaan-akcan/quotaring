[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-usage-widget"
version = "0.1.0"
description = "Desktop widget showing Claude Code, OpenAI Codex and Google Antigravity usage"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    # 6.12 breaks on Python < 3.12 (None refcount bug, abort at exit); see requirements.txt
    "PySide6-Essentials>=6.6; python_version >= '3.12'",
    "PySide6-Essentials>=6.6,<6.12; python_version < '3.12'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.10"]

[project.gui-scripts]
ai-usage-widget = "aiusage.app:main"

[tool.setuptools.packages.find]
include = ["aiusage*"]
